; JourneyPilot versioned migration configuration (ASCII for Windows locales).
;
; Do not set sqlalchemy.url here. The URL comes from config.yaml/environment
; through DatabaseConfig and migrations/env.py to keep API and migrations aligned.
;
; Use the CLI rather than calling Alembic directly:
;   uv run python journeypilot.py db status
;   uv run python journeypilot.py migrate
; The CLI handles census, backups, locks, and destructive migration approval.

[alembic]
script_location = migrations
prepend_sys_path = src:.
path_separator = os
# Sequential revision identifiers keep the linear migration order visible.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
