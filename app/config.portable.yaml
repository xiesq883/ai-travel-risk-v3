config_version: 2
env: development
debug: false
primary_model:
  api_key: ''
  model_name: deepseek-v4-pro
  base_url: https://api.deepseek.com
  max_tokens: 65536
  reasoning_effort: medium
  temperature: 0.7
  timeout: 120
fast_model:
  api_key: ''
  model_name: deepseek-v4-flash
  base_url: https://api.deepseek.com
  max_tokens: 65536
  reasoning_effort: low
  temperature: 0.5
  timeout: 30
embedding:
  provider: qwen3
  api_key: ''
  model_name: n24q02m/Qwen3-Embedding-0.6B-ONNX
  base_url: https://api.openai.com/v1
  dimensions: 1024
database:
  host: 127.0.0.1
  port: 58433
  name: travel_agent
  user: travel_agent
  password: ''
  pool_size: 10
  max_overflow: 20
maintenance:
  backup_dir: backups
  keep_automatic_backups: 5
  postgres_container: ''
  migration_lock_timeout_seconds: 30
redis:
  host: 127.0.0.1
  port: 18379
  password: ''
  db: 0
provider_snapshot_cache:
  enabled: true
  redis_key_prefix: journeypilot:provider-snapshot:v1
  redis_timeout_seconds: 0.25
  place_identity_ttl_seconds: 604800
  route_ttl_seconds: 300
server:
  host: 127.0.0.1
  port: 8011
  reload: false
  log_level: info
  allow_runtime_model_config: false
  cors_origins:
  - http://localhost:8080
  - http://127.0.0.1:8080
rag:
  chunk_size: 500
  chunk_overlap: 50
  top_k: 5
  score_threshold: 0.3
  chunker_type: contextual
  semantic_split_threshold: 0.5
  model_chunking_max_chars: 60000
  contextual_failure_threshold: 8
tool_exposure:
  mode: deferred
  worker_only: true
  min_tools_threshold: 8
run_control:
  plan_gate_enabled: true
  lease_seconds: 45
  lease_heartbeat_seconds: 10
  lease_heartbeat_failure_threshold: 3
  recovery_sweep_seconds: 60
  command_poll_seconds: 2.0
streaming:
  critical_queue_size: 128
  max_coalesced_chunk_chars: 2048
  max_pending_text_chars: 65536
  heartbeat_seconds: 15.0
  stalled_consumer_seconds: 30.0
background_jobs:
  poll_seconds: 5.0
  lease_seconds: 60
  batch_size: 1
  completed_retention_days: 30
blocking_work:
  pdf_export: 1
  document_parse: 2
  local_embedding: 2
  queue_wait_seconds: 30.0
ingest:
  max_upload_bytes: 10485760
  max_pdf_pages: 500
  max_docx_entries: 5000
  max_uncompressed_bytes: 104857600
  max_compression_ratio: 100.0
  max_extracted_chars: 2000000
  parse_timeout_seconds: 60.0
  parse_cpu_seconds: 60
  parse_address_space_bytes: 2147483648
run_deadline:
  target_seconds: 375
  closeout_seconds: 450
  composition_seconds: 570
  delivery_seconds: 600
run_budget:
  enforce_limits: false
  max_llm_calls: null
  max_tool_calls: null
  max_input_tokens: null
  max_output_tokens: null
  max_cost_usd: null
  max_tool_retries_per_target: null
provider_channels:
  primary_research_llm: 6
  online_fast_llm: 8
  ingest_contextual_llm: 4
  embedding: 4
rerank:
  enabled: true
  provider: llm
  model_name: BAAI/bge-reranker-v2-m3
  initial_top_k: 20
  final_top_k: 5
geocoding:
  nominatim_base_url: https://nominatim.openstreetmap.org
  user_agent: JourneyPilot/1.0 (travel itinerary geocoder; https://github.com/journeypilot)
  timeout_seconds: 10.0
  search_timeout_seconds: 3.4
  min_interval_seconds: 1.1
  search_cache_ttl_seconds: 604800
  search_cache_key_prefix: journeypilot:nominatim-search:v1
  search_cache_redis_timeout_seconds: 0.25
routing:
  transitous_base_url: https://api.transitous.org
  amap_base_url: https://restapi.amap.com
  user_agent: JourneyPilot/2.0 (https://github.com/journeypilot)
  timeout_seconds: 20.0
  min_interval_seconds: 1.0
data_snapshots:
  station_max_age_days: 90
checkpoint_retention:
  completed_days: 30
  cancelled_days: 30
  failed_interrupted_days: 90
  batch_size: 100
  require_on_startup: false
model_pricing:
- pattern: deepseek-v4-flash
  provider: deepseek
  input_per_1m: 0.14
  cached_input_per_1m: 0.0028
  output_per_1m: 0.28
  currency: USD
  effective_from: '2026-07-03'
  source_url: https://api-docs.deepseek.com/quick_start/pricing
- pattern: deepseek-v4-pro
  provider: deepseek
  input_per_1m: 0.435
  cached_input_per_1m: 0.003625
  output_per_1m: 0.87
  currency: USD
  effective_from: '2026-07-03'
  source_url: https://api-docs.deepseek.com/quick_start/pricing
logging:
  level: info
  file:
    enabled: true
    path: logs/
    rotation: 1 day
    retention: 7 days
mcp:
  servers:
    baidu-maps:
      env:
        BAIDU_MAP_API_KEY: ''
      disabled: true
    duckduckgo-search:
      disabled: false
    tavily-search:
      env:
        TAVILY_API_KEY: ''
      disabled: true
    brave-search:
      env:
        BRAVE_API_KEY: ''
      disabled: true
    firecrawl:
      env:
        FIRECRAWL_API_KEY: ''
      disabled: true
    amap-maps:
      env:
        AMAP_MAPS_API_KEY: ''
      min_interval_seconds: 0.35
      disabled: true
    duffel-flights:
      env:
        DUFFEL_API_KEY_LIVE: ''
      disabled: true
    12306-train: {}
    open-meteo: {}
    currency-exchange-mcp: {}
usage:
  spool_path: data/usage/outbox.sqlite3
  flush_seconds: 2
